# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Recreate ASCII Magic With Full Feature Parity"
  slug: "ascii-magic-parity"
  kind: specific
  tranche: "Discover the public ASCII Magic feature inventory and local repo shape, then implement successive safe verified slices until the local app reaches full user-visible feature parity."
  status: done
  intake:
    original_request: "recreate https://www.ascii-magic.com/, full deature parity"
    interpreted_outcome: "A local app recreates the public ASCII Magic website and its user-visible workflows with feature parity."
    input_shape: specific
    audience: "Users who want the ASCII Magic experience recreated locally."
    authority: requested
    proof_type: demo
    completion_proof: "A final audit demonstrates every public workflow discovered from ascii-magic.com working locally, with tests or browser checks for conversion, controls, exports/copy paths, error states, and responsive UI parity."
    likely_misfire: "Building a visually similar page while missing conversion options, exports, copy/download paths, output quality, edge cases, or interaction details from the public site."
    blind_spots_considered:
      - "The source site must be inspected during /goal, not during goal-prep, to identify the real public feature inventory."
      - "Feature parity may require matching UI behavior, image/text processing quality, output formats, responsiveness, accessibility, and error states."
      - "Existing local app architecture and verification commands are unknown until Scout maps the repo."
      - "The project instruction says to always commit in small batches."
    existing_plan_facts:
      - "User selected a local live GoalBuddy board."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/ascii-magic-parity/"
    command: "npx goalbuddy board /Users/oussmustaine/Documents/a-art/docs/goals/ascii-magic-parity"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

